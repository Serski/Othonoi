<style>

.kv dt { font: 500 12px/1.6 var(--font-pixel); color: var(--bone-dim); text-transform: uppercase; letter-spacing: 0.07em; }

/* ---------- theatre: the title, the arrival, the open studio, the end of the week ---------- */
#theater { position: fixed; inset: 0; z-index: 30; background: var(--glaze); display: grid; grid-template-rows: minmax(0, 1fr) auto; }

  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));

}

.summary h2 { margin: 0; text-align: center; font: 500 13px/1.3 var(--font-pixel); letter-spacing: 0.14em; text-transform: uppercase; color: var(--bone-dim); }
.rating { margin: 6px 0 14px; text-align: center; font: 700 26px/1.1 var(--font-pixel); color: var(--gold); text-wrap: balance; }
.tally { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 16px; margin: 0 0 14px; font-size: 15px; }
.tally dt { color: var(--bone-dim); }
.tally dd { margin: 0; text-align: right; font: 600 16px/1.4 var(--font-pixel); font-variant-numeric: tabular-nums; }
.t-text p.shipnote { margin: 4px 0 12px; padding: 10px 12px; border: 2px solid var(--sea-deep); background: var(--glaze-2); font: 15px/1.5 var(--font-story); }
.t-top.at-top { place-content: start center; padding-top: max(26px, env(safe-area-inset-top, 0px)); }

<script>
(() => {
'use strict';

// ===== ENGINE START =====
// The rules of the week. Nothing in here touches the page, so tests/sim.js can play it on its own.

const HOUR_SECS = 2.4;                 // seconds of play to an hour on the island, at normal speed
const TRAVEL_SLOW = 2;                 // getting about (walking, a lift, the boat) takes twice as long to watch, so the walk can be seen
const WAKE = 8, OPEN_STUDIO = 19, LAST_DAY = 7, BOAT_BACK = 18;

const KMH = { road: 4, path: 3.2, steep: 2, car: 24 };

const NUM = ['no', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten', 'eleven', 'twelve'];

const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
const VERSION = 1;
const OUT = [];   // narration waiting for the page

const CHAPTERS = {
  inst: { numeral: 'I', name: 'The Installation', said: '“An installation,” you said. “Something out in the landscape. Big.”',
    reply: '“Big,” Dionysis said, and pushed his glasses up his nose. “It’s a small island. But all right.”' },
  song: { numeral: 'II', name: 'The Song', said: '“A song,” you said. “About the island. Made out of the island, if I can.”',
    reply: '“Good,” said Dionysis. “The island is very loud in the summer. You won’t be short of material.”' },
  beach: { numeral: 'III', name: 'The Beach', said: 'You thought about the proposal you had sent, which was serious and had footnotes. “Honestly?” you said. “I’m going to the beach.”',
    reply: 'Dionysis looked at you over the top of his glasses for a long moment. “That,” he said, “is the first honest thing an artist has said to me all summer.”' },
};
const CH_ORDER = ['inst', 'song', 'beach'];

// ---------- the island ----------
// Positions are in map units: the island's bounding box on the reference map, 1323 by 976, about 270 to a kilometre.
const PLACES = {

};
const PLACE_ORDER = ['kalogerou', 'chorio', 'dafni', 'imerovigli', 'xylo', 'stavros', 'ammos', 'aspri', 'cave', 'fyki', 'kastri'];
const JUNCTIONS = { serp: [583, 532], cross: [568, 472], damask: [730, 400], kasim: [721, 532] };
const nodeXY = id => PLACES[id] ? [PLACES[id].x, PLACES[id].y] : JUNCTIONS[id];
// [from, to, kind, the points in between]. The road up from Ammos climbs in hairpins; the old stone path goes straight up.
const EDGES = [
  ['ammos', 'serp', 'road', [[648, 782], [618, 732], [603, 632], [598, 572], [572, 562], [600, 550], [570, 541], [596, 534]]],
  ['serp', 'cross', 'road', [[575, 500]]],
  ['cross', 'kalogerou', 'road', [[508, 482], [428, 492], [348, 482], [268, 482]]],
  ['kalogerou', 'chorio', 'road', [[208, 464]]],
  ['chorio', 'dafni', 'road', [[228, 392], [278, 352]]],
  ['cross', 'damask', 'road', [[618, 452], [678, 422]]],
  ['ammos', 'kasim', 'road', [[708, 732], [703, 652]]],
  ['kasim', 'damask', 'road', [[726, 470]]],
  ['damask', 'kastri', 'road', [[788, 352], [868, 312], [968, 272], [1068, 212], [1148, 152], [1218, 122]]],
  ['ammos', 'kalogerou', 'path', [[668, 782], [598, 737], [528, 682], [448, 622], [368, 562], [288, 522]]],
  ['kalogerou', 'imerovigli', 'steep', [[213, 512], [243, 572], [268, 632], [283, 682]]],
  ['chorio', 'xylo', 'steep', [[138, 452], [78, 472]]],
  ['damask', 'fyki', 'path', [[698, 352], [668, 302]]],
  ['cross', 'stavros', 'path', [[558, 452]]],
];
const GRAPH = (() => {
  const adj = {}, edges = [];
  for (const [a, b, kind, mid] of EDGES) {
    const pts = [nodeXY(a), ...mid, nodeXY(b)];
    let len = 0; for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    const e = { a, b, kind, pts, km: len / PX_KM * BEND[kind] };
    edges.push(e);
    (adj[a] = adj[a] || []).push({ e, to: b, fwd: true });
    (adj[b] = adj[b] || []).push({ e, to: a, fwd: false });
  }
  return { adj, edges };
})();
const legHours = (kind, km, mode) => km / (mode === 'car' && kind === 'road' ? KMH.car : KMH[kind]);
// The quickest way from one place to another, on foot or in Dionysis's car (which goes as far as the road does).
function route(from, to, mode) {
  if (from === to) return { hours: 0, km: 0, walkKm: 0, legs: [] };
  const dist = { [from]: 0 }, prev = {}, done = new Set();
  for (;;) {
    let u = null, best = Infinity;
    for (const k in dist) if (!done.has(k) && dist[k] < best) { best = dist[k]; u = k; }
    if (u === null) return null;
    if (u === to) break;
    done.add(u);
    for (const { e, to: v, fwd } of GRAPH.adj[u] || []) {
      const h = dist[u] + legHours(e.kind, e.km, mode);
      if (h < (dist[v] == null ? Infinity : dist[v]) - 1e-9) { dist[v] = h; prev[v] = { u, e, fwd }; }
    }
  }
  const legs = [];
  for (let v = to; v !== from; v = prev[v].u) {
    const { e, fwd } = prev[v], hours = legHours(e.kind, e.km, mode);
    legs.unshift({ kind: e.kind, km: e.km, hours, car: mode === 'car' && e.kind === 'road', pts: fwd ? e.pts : e.pts.slice().reverse() });
  }
  const hours = legs.reduce((a, l) => a + l.hours, 0), km = legs.reduce((a, l) => a + l.km, 0), walkKm = legs.reduce((a, l) => a + (l.car ? 0 : l.km), 0);
  return { hours, km, walkKm, legs };
}

// ---------- what the island gives you ----------
const MATERIALS = { wood: 'Driftwood', stone: 'Stones', net: 'Old net', tile: 'Roof tiles' };
const SOUNDS = { waves: 'Waves on the beach', cave: 'The echo in Calypso’s cave', cicadas: 'Cicadas in the olives', owl: 'A scops owl at night', bell: 'The bell of Agios Georgios',
  wind: 'The wind at Kastri', goats: 'Goat bells at Dafni', harbour: 'The harbour at Ammos', taverna: 'The taverna at dinner' };
const SWIMS = { ammos: 'The harbour beach', aspri: 'Aspri Ammos', cave: 'Calypso’s cave', xylo: 'Xylosermoi', fyki: 'Fyki bay', kamini: 'Cape Kamini' };
const KEEPS = { sand: 'A bottle of white sand from Aspri Ammos', pebble: 'A pebble with a hole in it', postcard: 'A postcard of Othonoi, not written', photo: 'A photograph of the sun going down' };
// What the installation can be about, and the verses of the song: both come from the stories the island tells you.
const THEMES = {
  monk: { title: 'The Monk’s Marks', about: 'with shapes cut into it, copied from the carvings over the door at Kalogerou' },
  leaving: { title: 'Letters Home', about: 'with every piece turned to face a place the islanders left for: Corfu, Athens, America' },
  block2: { title: 'Block 2', about: 'all of it pointing south-west, out to sea, towards the place where they want to drill' },
  ogygia: { title: 'Seven Years', about: 'in seven parts, one for each year Odysseus is said to have spent with Calypso' },
  y1537: { title: '1537', about: 'arranged in a ring around an empty space' },
  light: { title: 'Every Ten Seconds', about: 'with one pale post at the top that catches the light, the way the lighthouse does every ten seconds' },
  sara: { title: 'Wreck', about: 'laid out like the ribs of a ship' },
};
const VERSES = {
  monk: ['A monk cut shapes in the stone by the door,', 'and nobody knows what he cut them for.'],
  leaving: ['They built a school by the harbour wall;', 'the children grew up and sailed off, all.'],
  block2: ['Out where the sun goes into the sea,', 'they want to drill. They did not ask me.'],
  ogygia: ['Seven years in a cave by the shore,', 'and nobody can prove it, any more.'],
  y1537: ['A white cross stands on the hill for the year', 'the ships came in, and the island was here.'],
  light: ['Every ten seconds the lighthouse says:', 'here is the island, here is the island.'],
  sara: ['The Sara sleeps in the bay at Fyki,', 'and the fish go in and out of her rooms.'],
};
const CHORUS = ['Othonoi, Othonoi, the last island west,', 'the sea all around, and the cicadas never rest.'];

// ---------- the stories the island tells ----------
// Each is told once, the first time you are there. Where a story is tradition rather than record, the island says so.
const STORIES = {
  school: { title: 'The old school', who: 'dionysis', unlock: 'leaving',
    text: ['Behind the harbour stood a long stone building with a tiled roof. “The school,” Dionysis said. “Built in 1912.” It is not a school any more.',
      '“In those days the island was full of children,” he said. “Then, from about 1900 to 1960, most of the families left. For Corfu, for Athens, for America. They sent money home, and some of them still come back in the summer.”'],
    choices: [{ id: 'ask', label: 'Ask why they left' }, { id: 'look', label: 'Look in through the window' }],
    out: { ask: ['“Work,” he said. “Ships. A small island can feed a few families. It can’t feed a whole school.”'],
      look: ['You could not see much through the glass. Your own reflection, mostly, and behind it the harbour.'] },
    fact: 'The school at Ammos was built in 1912. Local histories say that between about 1900 and 1960 many islanders left, for Corfu, Athens and the United States.' },
  island: { title: 'The westernmost island', who: 'dionysis',
    text: ['Over lunch Dionysis explained the island. It is about ten square kilometres, depending on who measured it. It is the biggest of the Diapontian islands, and the westernmost inhabited island in Greece. After it there is only sea, and then Italy.',
      '“Local histories say a king of Naples gave it to a man called Theodore Skalitis, in 1383,” he said. “Then Venice held these waters until 1797. After that the islands changed hands until the British took them under their protection, and in 1864 they joined Greece.”'],
    choices: [{ id: 'fish', label: 'Ask about the fish' }, { id: 'more', label: 'Ask what there is to do' }],
    out: { fish: ['“The fish is from this morning,” he said. “Everyone says that. Here it’s usually true.”'],
      more: ['“Swim,” he said. “Walk. Eat. Look at things. Then make something about it. That’s the residency.”'] },
    fact: 'Othonoi is about ten square kilometres, the largest of the Diapontian islands, and widely described as the westernmost inhabited island in Greece. Venetian rule ended in 1797; with the rest of the Ionian Islands, Othonoi joined Greece in 1864.' },
  monk: { title: 'The monk’s house', who: 'dionysis', unlock: 'monk',
    text: ['The house was built in 1844, of stone, with two storeys, two bedrooms, and a covered veranda almost as big as the house.',
      '“According to the people who look after it,” Dionysis said, “the first person to live here was a monk. A kalogeros. That’s where the name comes from. They say he carved these.” He touched the stones over the door. There were shapes cut in them, worn soft by nearly two hundred summers.'],
    choices: [{ id: 'touch', label: 'Touch the carvings' }, { id: 'ask', label: 'Ask about the monk' }],
    out: { touch: ['The stone was warm. It had been in the sun all day, and for most of the last two centuries.'],
      ask: ['“Nobody knows much,” Dionysis said. “He lived here. He carved stone. That’s more than most of us will leave behind.”'] },
    fact: 'Kalogerou was built in 1844 in Chorio. By the house’s own account its first inhabitant was a monk, a kalogeros, who gave it its name, and the carved stones on its façades are his.' },
  block2: { title: 'The view from Imerovigli', who: 'dionysis', unlock: 'block2',
    text: ['From the top of the island, 393 metres up, you could see everything. Corfu, long and blue to the south-east. Ereikoussa and Mathraki, low in the water. The mountains of Albania. To the west, nothing but sea. “On a very clear day,” Dionysis said, “they say you can see Italy.”',
      'He pushed his glasses up his nose and pointed south-west. “Out there, west of Corfu, there’s a stretch of sea they call Block 2. Energean, ExxonMobil and HELLENiQ Energy want to drill an exploratory gas well there in 2027. The first in Greek waters for more than forty years.”',
      '“The regional councils approved the environmental study. The cultural associations of Othonoi and Mathraki said no. The company says the well is nowhere near any island. About forty kilometres, the local papers say.”'],
    choices: [{ id: 'ask', label: 'Ask what he thinks' }, { id: 'look', label: 'Just look at the sea' }],
    out: { ask: ['“I think a lot of people will have opinions about it,” he said, “and nobody will ask the sea.”'],
      look: ['The sun went down into the sea, more or less where the well would be. It did not seem to know about it.'] },
    fact: 'Block 2 is about 2,400 square kilometres of sea west of Corfu, held by Energean, ExxonMobil and HELLENiQ Energy. An exploratory gas well, Asopos-1, is planned for 2027. The cultural associations of Othonoi and Mathraki have opposed it.' },
  ogygia: { title: 'The cave of Calypso', unlock: 'ogygia',
    text: ['The cave went back into the cliff further than you could see. The water inside was a blue that does not have a name.',
      'People here call it the cave of Calypso. Some say that Othonoi is Ogygia, the island in the Odyssey where the nymph Calypso kept Odysseus for seven years. Your voice came back from the end of the cave a little late, as if it had been thinking it over.'],
    choices: [{ id: 'believe', label: 'Believe it' }, { id: 'proof', label: 'Ask for proof' }],

  y1537: { title: 'The white cross', unlock: 'y1537',
    text: ['On the hill at Stavros, 217 metres up, stands a white stone cross. It remembers the summer of 1537, when the Ottoman fleet of Hayreddin Barbarossa raided the island. Local histories say many of the islanders were killed, or carried off.',
      'They also say that after the battle of Lepanto, in 1571, people came to live here again: from Paxos, and from Parga, Ioannina and the rest of Epirus.'],
    choices: [{ id: 'ask', label: 'Wonder how many died' }, { id: 'stand', label: 'Stand there for a while' }],
    out: { ask: ['Nobody knows. No record from the time says how many. The cross is the record.'],
      stand: ['You stood there until the cicadas started up again.'] },
    fact: 'The cross at Stavros commemorates islanders who, local histories say, died in an Ottoman raid in 1537. No contemporary record gives the numbers.' },

    text: ['The lighthouse on Cape Kastri was first lit in 1872. It is a white brick tower about thirteen metres high, and at night it flashes white once every ten seconds.',

    choices: [{ id: 'count', label: 'Count to ten' }, { id: 'ruins', label: 'Climb up to the ruins' }],

function newGame(seed) {

}
function migrate(s) {
  if (!s || s.v !== VERSION) return null;

}
function startChapter(s, ch) {
  const keep = { v: VERSION, seed: s.seed, played: s.played || {} };
  for (const k of Object.keys(s)) delete s[k];
  Object.assign(s, keep, {
    ch, phase: 'day', day: 1, clock: 11, place: 'ammos', started: true,
    energy: 85, eur: MONEY, ideas: 0, food: 0, hat: false,
    ate: { lunch: false, dinner: false }, hungry: false, coolUntil: -1, liftDay: 0, boatDay: 0, stranded: false,
    tour: 0, visited: { ammos: 1 }, seen: {}, unlocked: {}, facts: [], count: {}, daily: {}, flags: {},
    busy: null, travel: null, pending: null, outcome: null, night: null, finale: null, summary: null,
    km: 0, swims: 0, meals: 0, naps: 0, sunsets: 0, lazy: 0,
    mat: { wood: 0, stone: 0, net: 0, tile: 0 }, site: null, theme: null, built: 0, blown: 0,
    snd: {}, verse: {}, verses: [], melody: 0, rehearsed: 0,
    swim: {}, keep: {}, gift: null, tan: 0, burnt: false, beachNight: false,
    log: [], said: {},
  });
  say(s, 'Day 1. You came to Othonoi on the morning boat from Corfu.', 'chap');

}
function say(s, text, tone) {
  const e = { text, tone: tone || '', when: s.phase === 'day' || s.phase === 'night' ? whenLabel(s) : '', ch: s.ch };
  s.log.push(e);
  if (s.log.length > 400) s.log.shift();
  if (tone !== 'quiet' && tone !== 'chap') OUT.push(e);
}
function sayOnce(s, key, text, tone) { if (s.said[key]) return false; s.said[key] = 1; say(s, text, tone); return true; }
const pad2 = n => (n < 10 ? '0' : '') + n;
function hourLabel(h) { const t = Math.round(h * 6) / 6, hh = Math.floor(t), mm = Math.round((t - hh) * 60); return pad2(hh % 24) + ':' + pad2(mm % 60); }
function whenLabel(s) { return WEEK[(s.day - 1) % 7] + ' ' + hourLabel(s.clock); }
const dayName = s => WEEK[(s.day - 1) % 7];
const mealNow = h => h >= LUNCH[0] && h < LUNCH[1] ? 'lunch' : h >= DINNER[0] && h < DINNER[1] ? 'dinner' : null;
const isHot = s => s.clock >= HEAT[0] && s.clock < HEAT[1] && s.coolUntil <= s.clock;
const tired = s => s.energy < 20;
const bump = (s, k, n) => { s.count[k] = (s.count[k] || 0) + (n == null ? 1 : n); return s.count[k]; };
const todayN = (s, k) => s.daily[s.day + ':' + k] || 0;
const markToday = (s, k) => { s.daily[s.day + ':' + k] = (s.daily[s.day + ':' + k] || 0) + 1; };
function gainIdeas(s, n) { s.ideas = Math.max(0, s.ideas + n); }
function meal(s, how) {

  s.ate[m] = true; s.hungry = false; s.meals += how === 'taverna' ? 1 : 0;

}
const matTotal = s => s.mat.wood + s.mat.stone + s.mat.net + s.mat.tile;

// Dionysis: with you on the first day, at the taverna on some evenings, and up at the house on Thursday morning.
function dionysisHere(s) {
  if (s.phase !== 'day') return false;
  if (s.day === 1 && s.tour < 7 && s.tour !== 4) return true;
  if (s.flags.withD) return true;

}

// The line under the place name: what to do next.
function hint(s) {
  if (s.phase !== 'day') return '';
  if (s.day === 1 && s.tour < 7) {
    if (s.tour === 4) return s.clock < OPEN_STUDIO ? 'Dionysis will be back at seven, to take you up Imerovigli for the sunset. Until then the island is yours.' : 'Dionysis is back. He wants to show you the sunset from Imerovigli.';
    return 'Dionysis is showing you the island.';
  }
  if (s.day === LAST_DAY && s.clock >= 15) return `The open studio is at seven, at ${PLACES[venue(s)].name}. Everyone is coming. On Othonoi that means a good number of people.`;
  if (PLACES[s.place].boat && s.clock >= 16) return 'The boat back to Ammos comes until six. After that, there is no way off this beach but swimming, and it is a long way.';
  if (tired(s)) return 'You are tired. Eat something, swim, or have a siesta.';
  if (s.hungry) return 'You missed lunch. The taverna in Ammos is open in the evening, or cook at the house.';
  if (s.ch === 'inst') {
    if (!s.site) return 'Find a place for the installation. Imerovigli, Aspri Ammos, the cape at Kastri, or the olive grove at Kalogerou would all do.';
    if (matTotal(s) < 6) return 'Gather materials. Driftwood washes up at Xylosermoi and Fyki, Aspri Ammos has white stones, the fishermen at Ammos have old nets, and Chorio has broken roof tiles.';
    if (!s.theme && unlockedList(s).length) return 'Decide what it is about. The stories you have heard are in the Work tab. Think it through at the house.';
    if (!s.theme) return 'You need to know what it is about. Go and listen to the island: the cross at Stavros, the lighthouse, the cave.';
    if (s.built < 3) return `Build it, at ${PLACES[s.site].name}. Each day of work needs materials, ideas and energy.`;
    return 'It is finished. You can make it better, or go swimming. Nobody would blame you.';
  }
  if (s.ch === 'song') {
    if (soundsN(s) < 4) return 'Record the island: the waves, the cicadas, the cave, the wind at Kastri, the goats at Dafni, the bell on Sunday.';
    if (s.verses.length < 3) return 'Write verses at the house, from the stories the island tells you.';
    if (s.melody < 3) return 'Work on the melody at the house. It needs ideas, and time.';
    if (!s.rehearsed) return 'Rehearse it, at the house.';
    return 'The song is ready. Go swimming. Songs need that too.';
  }
  const g = goalsOf(s).find(x => !x.done);
  return g ? 'The plan for today: ' + g.text.charAt(0).toLowerCase() + g.text.slice(1) + '.' : 'You have done everything. Now do it again, more slowly.';
}

  { id: 'sketch', where: at('kalogerou'), label: 'Draw plans in the studio', sub: 'Turn time into ideas, at the big table on the veranda.', hours: 2, drain: 4, pose: 'sketch', out: false, icon: 'sketch',

  { id: 'rehearse', where: s => s.place === 'kalogerou', label: 'Rehearse the song', sub: 'All of it, from the top, as if somebody were listening.', hours: 1.5, drain: 6, pose: 'guitar', out: false, icon: 'guitar',

  { id: 'rec_cicadas', where: at('kalogerou', 'chorio', 'dafni'), label: 'Record the cicadas', sub: 'Loudest in the heat of the day.', hours: 0.75, drain: 3, pose: 'record', icon: 'record',

const ACT = Object.fromEntries(ACTS.map(a => [a.id, a]));
const SITE_WHY = { imerovigli: 'The top of the island. Everybody will have to climb to see it, which is part of it.', aspri: 'Under the white cliffs, where only the boat comes.', kastri: 'On the cape, by the lighthouse, facing out to sea.', kalogerou: 'In the olive grove behind the house, among trees older than the house.' };
const SITE_LINE = {
  imerovigli: 'You chose the top of Imerovigli. Dionysis said nobody would climb up there to look at art. Then he said he would, and so would everybody else, out of curiosity.',
  aspri: 'You chose the beach at Aspri Ammos, under the white cliffs. The open studio would have to come by boat. You liked that.',
  kastri: 'You chose the cape at Kastri, by the lighthouse. Whatever you made would face out to sea, like the lighthouse, and like the fortress before it.',
  kalogerou: 'You chose the olive grove behind the house. The trees were older than the house, and the house was older than anyone. It seemed a good place to add something new.',
};
const BUILD_NEED = [6, 10, 14];

// ---------- the clock ----------

// ---------- night and morning ----------

  5: 'Friday. The wind was up early, out of the north-west: the maistro. By the afternoon it would be properly windy.',
  6: 'Saturday. There was to be a party at the harbour tonight, and the whole island was invited, which on Othonoi is not as many people as it sounds.',

  bell(when, vol, dest) { this.ping(392, vol || 0.14, when, 3.2, [[1, 1], [2.0, 0.5], [2.4, 0.35], [3.0, 0.2], [4.2, 0.1]], dest); },
  goatBells(when, dest) { for (let i = 0; i < 4; i++) this.ping(1700 + Math.random() * 900, 0.03, (when || 0) + i * 0.16 + Math.random() * 0.1, 0.4, [[1, 1], [2.3, 0.3]], dest); },
  coin() { this.ping(2093, 0.1, 0, 0.3); this.ping(2637, 0.08, 0.06, 0.35); },
  splash() { this.noise(500, 0.7, 0.28, 0.5, 'lowpass'); this.noise(1800, 1, 0.08, 0.25, 'bandpass', 0.05); },
  step() { this.noise(900, 1, 0.06, 0.06); },
  nope() { this.ping(180, 0.12, 0, 0.18, [[1, 1]]); },
  yes() { this.pluck(NOTES[2], 0.18); this.pluck(NOTES[4], 0.16, 0.12); this.pluck(NOTES[5], 0.14, 0.24); },
  event() { this.pluck(NOTES[1], 0.16); this.pluck(NOTES[5], 0.13, 0.2); },
  arrive() { [0, 2, 4, 5].forEach((n, i) => this.pluck(NOTES[n], 0.13, i * 0.2)); },
  horn() {
    if (!this.ctx || this.muted) return;
    const ctx = this.ctx, t = ctx.currentTime, env = ctx.createGain();
    env.gain.setValueAtTime(0.0001, t); env.gain.exponentialRampToValueAtTime(0.12, t + 0.15); env.gain.setValueAtTime(0.12, t + 1.1); env.gain.exponentialRampToValueAtTime(0.0001, t + 1.8);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.connect(env); env.connect(this.out);
    for (const [f, v] of [[147, 1], [148.2, 0.6], [220, 0.3]]) { const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; const g = ctx.createGain(); g.gain.value = v * 0.25; o.connect(g); g.connect(lp); o.start(t); o.stop(t + 1.9); }
  },
  music(kind) {   // a few notes on a guitar, now and then; an owl and crickets at night
    if (!this.ctx || this.muted) return;
    const now = this.ctx.currentTime;
    if (kind === 'night') {
      if (now > this.nextOwl) { this.nextOwl = now + 2.4 + Math.random() * 0.6; if (Math.random() < 0.85) this.hoot(); }
      if (now > this.nextCricket) { this.nextCricket = now + 0.6 + Math.random() * 0.9; for (let i = 0; i < 3; i++) this.ping(4300, 0.012, i * 0.05, 0.04, [[1, 1]]); }
      return;
    }
    if (now < this.nextNote) return;
    this.nextNote = now + 7 + Math.random() * 7;
    const k = 3 + Math.floor(Math.random() * 3), start = Math.floor(Math.random() * 4);
    for (let i = 0; i < k; i++) this.pluck(NOTES[Math.min(8, start + Math.floor(Math.random() * 4))], 0.06, i * (0.3 + Math.random() * 0.25));
  },
  // The song from Chapter II: the sounds you recorded underneath, the melody you found, the verses you wrote. Returns its length in seconds.
  playSong(parts) {
    this.init();
    if (!this.ctx || this.muted) return 0;
    const ctx = this.ctx, t0 = ctx.currentTime + 0.3, bus = ctx.createGain(); bus.gain.value = 1; bus.connect(this.out);
    let echo = null;
    if (parts.sounds.includes('cave')) {   // the cave: an echo on everything
      const d = ctx.createDelay(1); d.delayTime.value = 0.32; const fb = ctx.createGain(); fb.gain.value = 0.35; const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
      bus.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(this.out); echo = d;
    }
    const verses = parts.verses.length ? parts.verses : [['', '']], beat = 0.46, bar = beat * 4;
    const sections = [{ kind: 'intro', bars: 2 }].concat(verses.map((v, i) => ({ kind: 'verse', i, bars: 2 }))).concat(parts.chorus ? [{ kind: 'chorus', bars: 4 }] : []).concat([{ kind: 'outro', bars: 1 }]);
    const total = sections.reduce((a, s2) => a + s2.bars * bar, 0) + 1.5;
    // the island underneath
    const S0 = parts.sounds;
    if (S0.includes('waves')) for (let k = 0; k < total; k += 2.6) this.noise(420, 0.6, 0.12, 2.4, 'lowpass', t0 - ctx.currentTime + k, bus);
    if (S0.includes('wind')) for (let k = 0; k < total; k += 3.4) this.noise(700 + Math.random() * 400, 0.8, 0.05, 3.2, 'bandpass', t0 - ctx.currentTime + k, bus);
    if (S0.includes('cicadas')) for (let k = 0; k < total; k += 0.09) if ((k % 6) < 3.2) this.noise(5200, 7, 0.012, 0.07, 'bandpass', t0 - ctx.currentTime + k, bus);
    if (S0.includes('owl')) for (let k = 1; k < total; k += 2.6) this.hoot(t0 - ctx.currentTime + k, bus);
    if (S0.includes('goats')) for (let k = 2; k < total; k += 5.5) this.goatBells(t0 - ctx.currentTime + k, bus);
    if (S0.includes('bell')) { this.bell(t0 - ctx.currentTime, 0.1, bus); this.bell(t0 - ctx.currentTime + total - 2.6, 0.12, bus); }
    if (S0.includes('harbour')) for (let k = 4; k < total; k += 9) this.noise(140, 2, 0.05, 2.2, 'lowpass', t0 - ctx.currentTime + k, bus);
    if (S0.includes('taverna')) for (let k = 3; k < total; k += 2.3) this.ping(2600 + Math.random() * 800, 0.025, t0 - ctx.currentTime + k + Math.random(), 0.3, [[1, 1], [2.7, 0.3]], bus);
    // the guitar and the tune
    const chords = [[0, 2, 4], [3, 5, 7], [4, 6, 8], [0, 2, 4]], tune = [[4, 4, 5, 4, 2, 1, 2, -1], [2, 2, 4, 5, 4, 2, 1, -1], [5, 5, 6, 5, 4, 2, 4, -1], [4, 2, 1, 2, 0, -1, 0, -1]];
    let at0 = 0;
    for (const sec of sections) {
      for (let b = 0; b < sec.bars; b++) {
        const ch = chords[(b + (sec.kind === 'chorus' ? 1 : 0)) % 4], base = t0 - ctx.currentTime + at0 + b * bar;
        for (let q = 0; q < 4; q++) this.pluck(NOTES[ch[q % 3]] / 2, 0.08, base + q * beat, bus);
        if (sec.kind === 'verse' || sec.kind === 'chorus') {
          const line = tune[(b + 2 * (sec.i || 0)) % 4];
          for (let n = 0; n < 8; n++) if (line[n] >= 0 && (parts.melody >= 2 || n % 2 === 0)) this.pluck(NOTES[line[n] + (sec.kind === 'chorus' ? 1 : 0)] * (parts.melody >= 3 ? 1 : 0.5) * 2, 0.11, base + n * beat / 2, bus);
        }
      }
      sec.at = at0; at0 += sec.bars * bar;
    }
    this.songSections = sections;
    return total;
  },
};

const closeBtn = () => '<button class="btn wide" type="button" data-act="close">Done</button>';

// ---- the story line under the purse ----
function pumpStory(now) {
  while (OUT.length) UI.queue.push(OUT.shift());
  if (UI.queue.length > 3) UI.queue.splice(0, UI.queue.length - 3);
  if (!UI.queue.length || now - UI.shownAt < UI.holdFor) return;
  const e = UI.queue.shift();
  els.stripText.textContent = e.text;
  els.stripText.className = e.tone === 'bad' || e.tone === 'good' ? e.tone : '';
  void els.stripText.offsetWidth; els.stripText.classList.add('in');
  UI.shownAt = now;
  UI.holdFor = clamp(1400 + e.text.length * 32, 2400, 6000) * (UI.queue.length > 1 ? 0.55 : 1) / Math.max(1, (S.busy || S.travel ? UI.speed * DEV.speed * 0.7 : 1));
}
const GAINS = [['ideas', s => s.ideas, 'idea', 'ideas'], ['mat', s => matTotal(s), 'piece of material', 'pieces of material'], ['snd', s => soundsN(s), 'sound', 'sounds'], ['verse', s => s.verses.length, 'verse', 'verses'],
  ['swim', s => swimsN(s), 'new place to swim', 'new places to swim'], ['food', s => s.food, 'meal of food', 'meals of food'], ['keep', s => keepsN(s), 'thing for the collection', 'things for the collection']];
function floatGains() {   // compare with the last look, and float up whatever was gained
  if (!S || S.phase !== 'day' || !S.ch) { UI.gainsSeen = null; return; }
  const now = GAINS.map(g => g[1](S));
  if (UI.gainsSeen && UI.gainsCh === S.ch && UI.gainsDay === S.day) {
    let k = 0;
    GAINS.forEach((g, i) => { const d = now[i] - UI.gainsSeen[i]; if (d > 0) floater('+' + d + ' ' + (d === 1 ? g[2] : g[3]), k++); });
  }
  UI.gainsSeen = now; UI.gainsCh = S.ch; UI.gainsDay = S.day;
}
function floater(text, k) {
  if (reduceMotion) return;
  const el = document.createElement('div');
  el.className = 'floater'; el.textContent = text; el.style.top = (66 + k * 8) + '%';
  els.stage.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}
function banner(title, sub) { els.banner.innerHTML = esc(title) + (sub ? `<small>${esc(sub)}</small>` : ''); els.banner.classList.add('on'); UI.bannerT = 2.6; }
const placeKey = () => [S.phase, S.place, S.day].join(':');
function onPlace() {
  const key = placeKey();
  if (key === UI.lastKey) return;
  const prev = UI.lastKey;
  UI.lastKey = key;
  if (!prev) return;
  els.banner.classList.remove('on'); UI.bannerT = 0;
  els.scene.setAttribute('aria-label', S.phase === 'night' ? 'Night at ' + PLACES[S.place].name + '.' : 'A picture of ' + (SCENE_FACING[S.place] || PLACES[S.place].name) + '.');
  if (S.phase === 'day') {
    const [pp, , pd] = prev.split(':');
    if (pp === 'night' || +pd !== S.day) { banner('Day ' + S.day, dayName(S)); UI.queue = []; UI.shownAt = -1e9; }
    else { banner(PLACES[S.place].name, PLACES[S.place].gr); Snd.arrive(); }
    if (UI.tab === 'map') setTab('here');
    UI.preview = null; UI.target = null;
  } else if (S.phase === 'night') { banner('Night', dayName(S)); setTab('here'); }
  save();
}

const D_FACTS = ['“Othonoi is about ten square kilometres,” he said. “It depends who measured it. Everybody here has measured it.”', '“Imerovigli is 393 metres,” he said. “Some people say 395. They are the kind of people who stand on the survey pillar.”',
  '“The lighthouse at Kastri was lit in 1872,” he said. “It flashes every ten seconds. Count it, one night. It’s better than counting sheep.”', '“Aspri Ammos you can only reach by boat,” he said. “That’s why it’s still white.”',
  '“There’s an old stone path from Ammos up to Chorio,” he said. “It takes about an hour. The road takes longer, unless you have a car, which is the whole problem with roads.”', '“The house was restored with the old materials and the old methods,” he said. “Lime, stone, wood. It breathes. In August it breathes quite hard.”',
  '“The Ionian University has had an art station here since 2021,” he said. “Students come out from Corfu to make things. Some of them even finish them.”',
  '“They are planning a place in Corfu, too, for next spring,” he said. “Loading Area, it’s called. For the library, and workshops, and talks. Plans are plans. We’ll see.”'];

function singSong() {
  const parts = songParts(S), len = Snd.playSong(parts), secs = Snd.songSections || [];

function showLog() {
  els.tText.innerHTML = '<ol class="log">' + S.log.filter(e => e.tone !== 'quiet').map(e => e.tone === 'chap' ? `<li class="chap">${esc(e.text)}</li>` : `<li><span class="when">${esc(e.when)}</span>${esc(e.text)}</li>`).join('') + '</ol>';

function theaterAct(t, b) {
  Snd.init();
  if (t === 'begin') playIntro(false);
  else if (t === 'next') { TH.i = Math.min(TH.lines.length - 1, TH.i + 1); introStep(); }
  else if (t === 'pick') { TH.chose = b.dataset.ch; introStep(); }
  else if (t === 'back') { TH.chose = null; introStep(); }
  else if (t === 'ashore') beginWeek(TH.chose, false);
  else if (t === 'skipday') beginWeek(TH.chose, true);
  else if (t === 'continue') { closeTheater(); renderPanel(); }
  else if (t === 'new') { if (b.dataset.armed) playIntro(true); else { b.dataset.armed = '1'; b.textContent = 'Tap again: this week will be lost'; } }
  else if (t === 'fnext') { TH.i = Math.min(TH.lines.length - 1, TH.i + 1); finaleStep(); }
  else if (t === 'sing') singSong();
  else if (t === 'end') { UI.song = null; if (S.phase === 'finale') endWeek(S); save(); showSummary(); }
  else if (t === 'another') playIntro(true);
  else if (t === 'log') showLog();
  else if (t === 'back2') showSummary();
}

// ---- what the buttons do ----
function doAct(act, b) {
  switch (act) {
    case 'do': {
      const id = b.dataset.id, A = ACT[id], v = actView(S, A);
      if (v.why) { Snd.nope(); toast(v.why); break; }
      const r = startAct(S, id);
      if (!r.ok) { Snd.nope(); toast(r.msg); break; }
      if (v.eur) Snd.coin();
      if (A.pose === 'swim') Snd.splash();
      if (A.icon === 'record') tipOnce('rec', 'Recording. The sound goes into your song.');
      break;
    }
    case 'speed': UI.speed = +b.dataset.v; UI.mounted = ''; break;
    case 'wake': { const r = wake(S); if (r.ok) Snd.yes(); break; }
    case 'go': {
      const r = goTo(S, b.dataset.place, b.dataset.mode);
      closeSheet();
      if (!r.ok) { Snd.nope(); toast(r.msg); break; }
      Snd.step();
      if (b.dataset.mode === 'car') tipOnce('car', 'Dionysis is on his way. He drives as far as the road goes.');
      break;
    }
    case 'choose': {
      const id = S.pending, title = evTitle(S, id), lines = resolveEvent(S, b.dataset.c);
      if (!lines.length) break;
      Snd.yes();
      if (STORIES[id]) { UI.newFact = true; }
      UI.outcome = { title, lines }; renderSheet(true); save();
      break;
    }
    case 'continue': UI.outcome = null; if (S.pending) renderSheet(true); else closeSheet(); break;
    case 'close': closeSheet(); break;
    case 'talk': UI.talkN = (UI.talkN || 0) + 1; renderSheet(); break;
    case 'skip': if (skipTour(S)) { UI.lastKey = placeKey(); toast('The first day went by, much as it did before.'); } break;
    case 'sound': toggleSound(); renderSheet(); break;
    case 'chapters': closeSheet(); playIntro(true); break;
    case 'restart': if (UI.armed === 'restart') { const ch = S.ch; closeSheet(); beginWeek(ch, false); } else { UI.armed = 'restart'; renderSheet(); } break;
  }
  renderPanel(); updateHUD(); updateTabs();
  save();
}
function toggleSound() { Snd.setMuted(!Snd.muted); try { localStorage.setItem(SOUND_KEY, Snd.muted ? '1' : '0'); } catch (e) { /* ignore */ } paintSound(); }
